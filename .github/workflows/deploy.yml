name: Test, build and push to container environments

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'tests/**'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ticket_api
  ECS_SERVICE: ticket_api_service
  ECS_CLUSTER: ticket_api_cluster
  CONTAINER_NAME: ticket-api  

jobs:
  test:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test application
        run: pytest --quiet

  build_and_push:
    name: build, scan & push to ecr
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to aws ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocks workflow if image contains highly severe security bugs
      - name: scan docker image using trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: push image to ecr
        id: build-image
        run: |
          REGISTRY_URL="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          
          # Force push using the unique commit SHA hash for explicit production auditing
          docker push $REGISTRY_URL:${{ github.sha }}
          
          # Set the job output variable
          echo "image_uri=$REGISTRY_URL:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: production rollout
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # pull the active task definition architecture from AWS 
      - name: download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition > task-def.json

      - name: fill in the new image id in the aws ecs task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build_and_push.outputs.image_uri }}

      - name: deploy aws ecs task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          # trigger the rollback if things get stuck for over 5 mins
          timeout-minutes: 5 
